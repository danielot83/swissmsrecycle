<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="logo-mark logo-mark--lg" viewBox="0 0 122 118" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 8 Q14 4 18 7 Q21 3 24 7 Q27 4 30 8" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <circle cx="18" cy="16" r="8" stroke="var(--ink)" stroke-width="2.1"/>
          <circle cx="14.8" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1.2"/>
          <circle cx="21.2" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1.2"/>
          <line x1="17.2" y1="16" x2="18.8" y2="16" stroke="var(--ink)" stroke-width="1.1"/>
          <path d="M15 20 Q18 22.5 21 20" stroke="var(--ink)" stroke-width="1" stroke-linecap="round" fill="none"/>
          <path d="M12 30 L18 38 L24 30" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M8 46 Q4 52 8 60" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path d="M28 46 Q32 52 28 60" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path d="M8 100 L8 44 Q8 30 18 30 Q28 30 28 44 L28 100" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="18" y1="40" x2="18" y2="98" stroke="var(--ink)" stroke-width="1.3"/>
          <rect x="13" y="54" width="10" height="10" rx="2" fill="var(--accent)"/>
          <rect x="17" y="56" width="2" height="6" fill="#fff"/>
          <rect x="15" y="58" width="6" height="2" fill="#fff"/>
          <rect x="46" y="46" width="68" height="68" rx="11" stroke="var(--ink)" stroke-width="2.6"/>
          <path id="ion-path-lg" d="M46 78 Q60 60 76 60 Q96 60 100 68 Q96 76 76 76 Q64 76 56 84 Q64 92 76 92 Q96 92 100 100 Q96 108 76 108 Q64 108 56 114" fill="none" stroke="var(--ink-soft)" stroke-width="1" opacity="0.4"/>
          <circle r="2.4" fill="var(--offer)">
            <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="##ion-path-lg"/></animateMotion>
          </circle>
          <circle r="2.4" fill="var(--offer)">
            <animateMotion dur="4.2s" begin="-2.1s" repeatCount="indefinite"><mpath href="##ion-path-lg"/></animateMotion>
          </circle></svg>
    <h1><span class="cap">S</span>wiss<span class="cap">M</span>s<span class="cap">R</span>ecycle</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
