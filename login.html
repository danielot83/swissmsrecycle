<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="logo-mark logo-mark--lg" viewBox="0 0 104 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="15" r="6.5" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="13.2" cy="15" r="2.3" stroke="var(--ink)" stroke-width="1.2"/>
      <circle cx="18.8" cy="15" r="2.3" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="15.5" y1="15" x2="16.5" y2="15" stroke="var(--ink)" stroke-width="1.2"/>
      <path d="M11 27 L16 34 L21 27" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 78 L7 40 Q7 27 16 27 Q25 27 25 40 L25 78" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="36" x2="16" y2="76" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="11" y="48" width="10" height="10" rx="2" fill="var(--accent)"/>
      <rect x="15" y="50" width="2" height="6" fill="#fff"/>
      <rect x="13" y="52" width="6" height="2" fill="#fff"/>
      <path d="M72 4 Q52 4 47 24 Q45 35 45 48 Q45 61 47 72 Q52 92 72 92 Q92 92 97 72 Q99 61 99 48 Q99 35 97 24 Q92 4 72 4 Z" stroke="var(--ink)" stroke-width="2.4"/>
      <path d="M72 18 Q66 18 64 34 Q63 41 63 48 Q63 55 64 62 Q66 78 72 78 Q78 78 80 62 Q81 55 81 48 Q81 41 80 34 Q78 18 72 18 Z" fill="var(--ink)"/>
      <path id="ion-path-lg" d="M22 36 Q34 40 44 44 Q56 30 72 30 Q88 30 92 36 Q88 42 72 42 Q60 42 54 48 Q60 54 72 54 Q88 54 92 60 Q88 66 72 66 Q60 66 54 72 Q62 76 72 78" fill="none" stroke="var(--ink-soft)" stroke-width="1" opacity="0.35"/>
      <circle r="2" fill="var(--offer)">
        <animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#ion-path-lg"/></animateMotion>
      </circle>
      <circle r="2" fill="var(--offer)">
        <animateMotion dur="3.5s" begin="-1.75s" repeatCount="indefinite"><mpath href="#ion-path-lg"/></animateMotion>
      </circle>
    </svg>
    <h1><span class="cap">S</span>wiss<span class="cap">M</span>s<span class="cap">R</span>ecycle</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
