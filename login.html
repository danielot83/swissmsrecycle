<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="logo-mark logo-mark--lg" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 9 Q13 3 17 7 Q20 1 23 6 Q27 5 29 10" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <circle cx="18" cy="16" r="8" stroke="var(--ink)" stroke-width="1.6"/>
          <circle cx="14.8" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1"/>
          <circle cx="21.2" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1"/>
          <line x1="17.2" y1="16" x2="18.8" y2="16" stroke="var(--ink)" stroke-width="0.9"/>
          <path d="M15 20 Q18 22.5 21 20" stroke="var(--ink)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
          <path d="M12 30 L18 38 L24 30" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M26 44 L38 36 L38 53" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="38" cy="55" r="1.8" fill="var(--ink)"/>
          <path d="M9 55 Q4 59 8 64" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M8 92 L8 44 Q8 30 18 30 Q28 30 28 44 L28 92" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="18" y1="40" x2="18" y2="90" stroke="var(--ink)" stroke-width="1"/>
          <rect x="14.5" y="55" width="7" height="7" rx="1.5" fill="var(--accent)"/>
          <rect x="17.3" y="56.3" width="1.4" height="4.4" fill="#fff"/>
          <rect x="15.8" y="57.8" width="4.4" height="1.4" fill="#fff"/>
          <rect x="40" y="40" width="74" height="16" stroke="var(--ink)" stroke-width="1.7"/>
          <rect x="114" y="10" width="40" height="76" stroke="var(--ink)" stroke-width="1.7"/>
          <path id="tof-path" d="M44 50 Q54 46 60 50 Q66 54 72 50 Q78 46 84 50 Q90 54 96 50 Q102 46 108 50 L114 50 L126 18 L136 42 L146 18 L150 74" stroke="var(--ink-soft)" stroke-width="1" opacity="0.4"/>
          <circle r="2.6" fill="var(--accent)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#tof-path"/></animateMotion></circle>
          <circle r="2.2" fill="var(--offer)"><animateMotion dur="3s" begin="-1s" repeatCount="indefinite"><mpath href="#tof-path"/></animateMotion></circle>
          <circle r="1.8" fill="var(--ion-blue)"><animateMotion dur="3s" begin="-2s" repeatCount="indefinite"><mpath href="#tof-path"/></animateMotion></circle></svg>
    <h1><span class="cap">S</span>wiss<span class="cap">M</span>s<span class="cap">R</span>ecycle</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
