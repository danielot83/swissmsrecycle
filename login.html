<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="logo-mark logo-mark--lg" viewBox="0 0 90 76" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="14" r="7" stroke="var(--ink)" stroke-width="2.2"/>
      <path d="M15 25 L20 33 L25 25" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 68 L11 34 Q11 24 20 24 Q29 24 29 34 L29 68" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="20" y1="34" x2="20" y2="66" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="46" y="40" width="32" height="24" rx="3" stroke="var(--ink)" stroke-width="2.2"/>
      <path d="M54 40 L64 40 L67 30 L51 30 Z" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
      <line x1="51" y1="60" x2="51" y2="54" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="57" y1="60" x2="57" y2="46" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="63" y1="60" x2="63" y2="50" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="69" y1="60" x2="69" y2="44" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="75" y1="60" x2="75" y2="56" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="50" y1="64" x2="50" y2="70" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <line x1="74" y1="64" x2="74" y2="70" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <rect x="64" y="4" width="18" height="18" rx="4" fill="var(--accent)"/>
      <rect x="71.5" y="7" width="3" height="12" fill="#fff"/>
      <rect x="67" y="11.5" width="12" height="3" fill="#fff"/>
    </svg>
    <h1>SMR</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
