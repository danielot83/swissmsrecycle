<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <svg class="logo-mark logo-mark--lg" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="16" height="16" rx="3" fill="var(--accent)"/>
      <rect x="10.5" y="7" width="3" height="10" fill="#fff"/>
      <rect x="7" y="10.5" width="10" height="3" fill="#fff"/>
      <circle cx="16" cy="31" r="7" stroke="var(--ink)" stroke-width="2.2"/>
      <path d="M11 42 L16 50 L21 42" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 86 L8 52 Q8 42 16 42 Q27 42 27 52 L27 86" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="16" y1="52" x2="16" y2="84" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M27 56 Q37 50 46 60" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="46" y="54" width="34" height="26" rx="4" stroke="var(--ink)" stroke-width="2.2"/>
      <path d="M55 54 L67 54 L70 44 L52 44 Z" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
      <line x1="50" y1="80" x2="50" y2="86" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <line x1="76" y1="80" x2="76" y2="86" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="63" cy="67" r="2" fill="var(--ink)"/>
      <g transform="rotate(20 63 67)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 63 67" to="360 63 67" dur="3s" repeatCount="indefinite"/>
          <ellipse cx="63" cy="67" rx="16" ry="6" fill="none" stroke="var(--ink-soft)" stroke-width="1"/>
          <circle cx="79" cy="67" r="2" fill="var(--offer)"/>
        </g>
      </g>
      <g transform="rotate(-25 63 67)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 63 67" to="-360 63 67" dur="4s" repeatCount="indefinite"/>
          <ellipse cx="63" cy="67" rx="16" ry="6" fill="none" stroke="var(--ink-soft)" stroke-width="1"/>
          <circle cx="47" cy="67" r="2" fill="var(--offer)"/>
        </g>
      </g>
    </svg>
    <h1>SwissMS Recycle</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
