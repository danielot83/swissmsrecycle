<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="hero-figure hero-figure--sm">
      <img class="person-photo" src="person.png" alt="Illustration of a scientist in a lab coat with a Swiss cross patch">
      <svg class="tof-mark" viewBox="-4 0 178 116" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0" y="0" width="110" height="30" rx="3" stroke="var(--ink)" stroke-width="1.7"/>
        <rect x="110" y="0" width="60" height="110" rx="3" stroke="var(--ink)" stroke-width="1.7"/>
        <line x1="110" y1="72" x2="170" y2="72" stroke="var(--ink)" stroke-width="1.3"/>
        <circle cx="122" cy="84" r="1.8" fill="var(--accent)"/>
        <circle cx="130" cy="84" r="1.8" stroke="var(--ink)" stroke-width="1"/>
        <line x1="118" y1="100" x2="118" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="124" y1="100" x2="124" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="130" y1="100" x2="130" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="136" y1="100" x2="136" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="142" y1="100" x2="142" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="148" y1="100" x2="148" y2="106" stroke="var(--ink)" stroke-width="1"/>
        <line x1="18" y1="30" x2="18" y2="36" stroke="var(--ink)" stroke-width="1.3"/>
        <line x1="92" y1="30" x2="92" y2="36" stroke="var(--ink)" stroke-width="1.3"/>
        <path id="tof-path-login" d="M4 18 Q14 12 20 18 Q26 24 32 18 Q38 12 44 18 Q50 24 56 18 Q62 12 68 18 Q74 24 80 18 Q86 12 92 18 Q98 24 104 18 L110 18 L124 6 L136 40 L148 6 L156 100" stroke="none"/>
        <circle r="3" fill="var(--accent)"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#tof-path-login"/></animateMotion></circle>
        <circle r="2.6" fill="var(--offer)"><animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#tof-path-login"/></animateMotion></circle>
        <circle r="2.2" fill="var(--ion-blue)"><animateMotion dur="3.2s" begin="-2.2s" repeatCount="indefinite"><mpath href="#tof-path-login"/></animateMotion></circle>
      </svg>
    </div>
    <h1><span class="cap">S</span>wiss<span class="cap">M</span>s<span class="cap">R</span>ecycle</h1>
    <p class="auth-sub">Log in to browse and post to the board.</p>

    <div class="tabs">
      <div class="tab active" data-mode="signin">Log in</div>
      <div class="tab" data-mode="signup">Create account</div>
    </div>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@institution.ch">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-accent auth-submit" id="submit-btn">Log in</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const form = document.getElementById('auth-form')
  const emailInput = document.getElementById('email')
  const passwordInput = document.getElementById('password')
  const submitBtn = document.getElementById('submit-btn')
  const msg = document.getElementById('form-msg')
  const tabs = document.querySelectorAll('.tab')

  let mode = 'signin'

  // If already logged in, skip straight to the app
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html'
  })

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      mode = tab.dataset.mode
      submitBtn.textContent = mode === 'signin' ? 'Log in' : 'Create account'
      passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password'
      msg.textContent = ''
    })
  })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'form-msg'
    msg.textContent = ''
    submitBtn.disabled = true

    const email = emailInput.value.trim()
    const password = passwordInput.value

    try {
      if (mode === 'signin') {
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error
        window.location.href = 'app.html'
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password })
        if (error) throw error

        if (data.session) {
          // Email confirmation disabled in Supabase settings — logged in right away
          window.location.href = 'app.html'
        } else {
          msg.className = 'form-msg ok'
          msg.textContent = 'Account created. Check your email to confirm, then log in.'
        }
      }
    } catch (err) {
      msg.className = 'form-msg error'
      msg.textContent = err.message || 'Something went wrong.'
    } finally {
      submitBtn.disabled = false
    }
  })
</script>

</body>
</html>
