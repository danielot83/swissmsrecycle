<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board — SwissMS Recycle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header class="app-header">
    <a class="brand" href="index.html">
      <svg class="logo-mark logo-mark--sm" viewBox="0 0 118 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 8 Q14 4 18 7 Q21 3 24 7 Q27 4 30 8" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <circle cx="18" cy="16" r="8" stroke="var(--ink)" stroke-width="2.1"/>
        <circle cx="14.8" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1.2"/>
        <circle cx="21.2" cy="16" r="2.6" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="17.2" y1="16" x2="18.8" y2="16" stroke="var(--ink)" stroke-width="1.1"/>
        <path d="M15 20 Q18 22.5 21 20" stroke="var(--ink)" stroke-width="1" stroke-linecap="round" fill="none"/>
        <path d="M12 30 L18 38 L24 30" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M8 46 Q4 52 8 60" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M28 46 Q32 52 28 60" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M8 90 L8 44 Q8 30 18 30 Q28 30 28 44 L28 90" stroke="var(--ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="18" y1="40" x2="18" y2="88" stroke="var(--ink)" stroke-width="1.3"/>
        <rect x="13" y="54" width="10" height="10" rx="2" fill="var(--accent)"/>
        <rect x="17" y="56" width="2" height="6" fill="#fff"/>
        <rect x="15" y="58" width="6" height="2" fill="#fff"/>
        <rect x="44" y="16" width="62" height="62" rx="10" stroke="var(--ink)" stroke-width="2.4"/>
        <circle cx="75" cy="47" r="2.4" fill="var(--ink)"/>
        <g transform="rotate(20 75 47)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 75 47" to="360 75 47" dur="3s" repeatCount="indefinite"/>
            <ellipse cx="75" cy="47" rx="22" ry="8" fill="none" stroke="var(--ink-soft)" stroke-width="1"/>
            <circle cx="97" cy="47" r="2.4" fill="var(--offer)"/>
          </g>
        </g>
        <g transform="rotate(-25 75 47)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0 75 47" to="-360 75 47" dur="4s" repeatCount="indefinite"/>
            <ellipse cx="75" cy="47" rx="22" ry="8" fill="none" stroke="var(--ink-soft)" stroke-width="1"/>
            <circle cx="53" cy="47" r="2.4" fill="var(--offer)"/>
          </g>
        </g>
      </svg>
      <span class="cap">S</span>wiss<span class="cap">M</span>s<span class="cap">R</span>ecycle
    </a>
    <div class="app-user">
      <span id="user-email">…</span>
      <button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="board-tabs">
    <button class="board-tab active" data-type="offer">Offered</button>
    <button class="board-tab" data-type="request">Needed</button>
  </div>

  <div class="board-layout">
    <div id="listings">
      <div class="empty-state">Loading…</div>
    </div>

    <div class="post-form">
      <h3>Post to the board</h3>
      <p class="hint">Visible to everyone logged in.</p>

      <div class="type-toggle" id="post-type-toggle">
        <button type="button" class="active" data-type="offer">Offer</button>
        <button type="button" data-type="request">Request</button>
      </div>

      <form id="post-form">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. HPLC column, C18, 2.1mm">

        <label for="description">Details</label>
        <textarea id="description" rows="3" placeholder="Condition, quantity, expiry, model…"></textarea>

        <label for="lab_name">Lab / platform</label>
        <input type="text" id="lab_name" required placeholder="e.g. Proteomics Core, Uni Bern">

        <button type="submit" class="btn btn-primary auth-submit">Post</button>
        <p class="form-msg" id="post-msg"></p>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const listingsEl = document.getElementById('listings')
  const userEmailEl = document.getElementById('user-email')
  const signoutBtn = document.getElementById('signout-btn')
  const boardTabs = document.querySelectorAll('.board-tab')
  const postTypeToggle = document.getElementById('post-type-toggle')
  const postForm = document.getElementById('post-form')
  const postMsg = document.getElementById('post-msg')

  let currentUser = null
  let activeBoard = 'offer'
  let postType = 'offer'
  let allListings = []

  // ---- Auth guard ----
  const { data: sessionData } = await supabase.auth.getSession()
  if (!sessionData.session) {
    window.location.href = 'login.html'
  } else {
    currentUser = sessionData.session.user
    userEmailEl.textContent = currentUser.email
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    if (!session) window.location.href = 'login.html'
  })

  signoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = 'index.html'
  })

  // ---- Board tabs ----
  boardTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      boardTabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      activeBoard = tab.dataset.type
      renderListings()
    })
  })

  // ---- Post form type toggle ----
  postTypeToggle.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      postTypeToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      postType = btn.dataset.type
    })
  })

  // ---- Render ----
  function renderListings() {
    const items = allListings.filter(i => i.type === activeBoard)
    if (items.length === 0) {
      listingsEl.innerHTML = `<div class="empty-state">
        Nothing ${activeBoard === 'offer' ? 'offered' : 'requested'} yet.
        Be the first to post on the right.
      </div>`
      return
    }
    listingsEl.innerHTML = items.map(item => `
      <div class="listing">
        <div class="listing-top">
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            ${item.description ? `<p>${escapeHtml(item.description)}</p>` : ''}
          </div>
          ${item.user_id === currentUser.id
            ? `<button class="btn btn-ghost btn-sm" data-remove="${item.id}">Remove</button>`
            : ''}
        </div>
        <div class="listing-meta">
          <span>${escapeHtml(item.lab_name || '')}</span>
          <span>${formatDate(item.created_at)}</span>
        </div>
      </div>
    `).join('')

    listingsEl.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => removeListing(btn.dataset.remove))
    })
  }

  function escapeHtml(str) {
    const div = document.createElement('div')
    div.textContent = str
    return div.innerHTML
  }

  function formatDate(iso) {
    const d = new Date(iso)
    return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' })
  }

  // ---- Data ----
  async function loadListings() {
    const { data, error } = await supabase
      .from('listings')
      .select('*')
      .eq('status', 'open')
      .order('created_at', { ascending: false })

    if (error) {
      listingsEl.innerHTML = `<div class="empty-state">Could not load the board: ${escapeHtml(error.message)}</div>`
      return
    }
    allListings = data
    renderListings()
  }

  async function removeListing(id) {
    const { error } = await supabase.from('listings').delete().eq('id', id)
    if (error) alert(error.message)
  }

  postForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    postMsg.className = 'form-msg'
    postMsg.textContent = ''

    const title = document.getElementById('title').value.trim()
    const description = document.getElementById('description').value.trim()
    const lab_name = document.getElementById('lab_name').value.trim()

    const { error } = await supabase.from('listings').insert({
      title,
      description,
      lab_name,
      type: postType,
      user_id: currentUser.id,
    })

    if (error) {
      postMsg.className = 'form-msg error'
      postMsg.textContent = error.message
    } else {
      postForm.reset()
      postMsg.className = 'form-msg ok'
      postMsg.textContent = 'Posted.'
      setTimeout(() => { postMsg.textContent = '' }, 2500)
    }
  })

  // ---- Realtime ----
  supabase
    .channel('listings-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'listings' }, loadListings)
    .subscribe()

  loadListings()
</script>

</body>
</html>
