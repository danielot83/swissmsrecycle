<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board — SwissMsRecycle</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://dortiz83.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="container">
  <header class="app-header">
    <a class="brand" href="index.html">
      <img class="brand-logo-img" src="logo-brand.png" alt="SwissMsRecycle">
    </a>
    <div class="app-user">
      <span id="user-email">…</span>
      <a href="settings.html" class="btn btn-ghost btn-sm">Settings</a>
      <button class="btn btn-ghost btn-sm" id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="app-hero">
    <div class="hero-figure hero-figure--sm">
      <img class="person-tof-photo" src="person-tof.png" alt="Illustration of a scientist leaning on a mass spectrometer">
      <svg class="ion-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle r="6" cy="50" fill="var(--accent)"><animateMotion path="M15 0 L85 0" dur="1.6s" repeatCount="indefinite"/></circle>
        <circle r="5" cy="50" fill="var(--offer)"><animateMotion path="M15 0 L85 0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/></circle>
        <circle r="4" cy="50" fill="var(--ion-blue)"><animateMotion path="M15 0 L85 0" dur="1.6s" begin="-1s" repeatCount="indefinite"/></circle>
      </svg>
      <svg class="ion-overlay ion-overlay--tower" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse rx="3.25" ry="0.94" fill="var(--accent)"><animateMotion path="M70 96 L70 22 Q70 4 45 4 L45 28" dur="2s" repeatCount="indefinite"/></ellipse>
        <ellipse rx="2.71" ry="0.79" fill="var(--offer)"><animateMotion path="M70 96 L70 22 Q70 4 45 4 L45 28" dur="2s" begin="-0.7s" repeatCount="indefinite"/></ellipse>
        <ellipse rx="2.17" ry="0.63" fill="var(--ion-blue)"><animateMotion path="M70 96 L70 22 Q70 4 45 4 L45 28" dur="2s" begin="-1.4s" repeatCount="indefinite"/></ellipse>
      </svg>
    </div>
    <p class="app-hero-text">Browse what labs nearby are giving away or looking for, or post your own.</p>
  </div>

  <div class="app-primary-action">
    <button class="btn btn-accent app-primary-btn" id="open-post-btn">Offer or request something</button>
  </div>

  <div class="app-tabs">
    <button class="app-tab active" data-view="available">See what's available</button>
    <button class="app-tab" data-view="needed">See what's needed</button>
    <button class="app-tab" data-view="history">See past exchanges</button>
  </div>

  <!-- ============ BROWSE VIEW ============ -->
  <section id="view-browse" class="app-view">
    <div class="filters">
      <select id="f-category">
        <option value="">All categories</option>
        <option value="Instrument">Instrument</option>
        <option value="Column">Column</option>
        <option value="Consumable">Consumable</option>
        <option value="Standard / reference material">Standard / reference material</option>
        <option value="Spare part">Spare part</option>
        <option value="Software / license">Software / license</option>
        <option value="Other">Other</option>
      </select>
      <select id="f-brand">
        <option value="">All brands</option>
      </select>
      <select id="f-model">
        <option value="">All models</option>
      </select>
      <select id="f-condition">
        <option value="">Any condition</option>
        <option value="New">New</option>
        <option value="Like new">Like new</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
        <option value="Needs repair">Needs repair</option>
        <option value="For parts only">For parts only</option>
      </select>
      <select id="f-org">
        <option value="">Any university / lab</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="clear-filters">Clear filters</button>
    </div>

    <div id="listings-grid" class="listings-grid">
      <div class="empty-state">Loading…</div>
    </div>
  </section>

  <!-- ============ HISTORY VIEW ============ -->
  <section id="view-history" class="app-view" style="display:none;">
    <div id="history-list" class="listings-grid">
      <p class="empty-state">Loading…</p>
    </div>
  </section>

  <!-- ============ POST VIEW ============ -->
  <section id="view-post" class="app-view" style="display:none;">
    <div class="post-card">
      <button type="button" class="modal-close post-close" id="post-close-btn" title="Close">×</button>
      <div class="type-toggle" id="post-type-toggle">
        <button type="button" class="active" data-type="offer">I have something to offer</button>
        <button type="button" data-type="request">I'm looking for something</button>
      </div>

      <form id="post-form">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. HPLC column, C18, 2.1mm">

        <div class="form-row">
          <div>
            <label for="category">Category</label>
            <select id="category">
              <option value="Instrument">Instrument</option>
              <option value="Column">Column</option>
              <option value="Consumable">Consumable</option>
              <option value="Standard / reference material">Standard / reference material</option>
              <option value="Spare part">Spare part</option>
              <option value="Software / license">Software / license</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="condition">Condition</label>
            <select id="condition">
              <option value="">—</option>
              <option value="New">New</option>
              <option value="Like new">Like new</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Needs repair">Needs repair</option>
              <option value="For parts only">For parts only</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="brand">Brand</label>
            <select id="brand">
              <option value="">—</option>
            </select>
          </div>
          <div>
            <label for="model">Model</label>
            <select id="model" style="display:none;">
              <option value="">—</option>
            </select>
            <input type="text" id="model-text" placeholder="e.g. Xevo G2-XS">
          </div>
        </div>

        <label for="description">Details</label>
        <textarea id="description" rows="3" placeholder="Model, quantity, expiry, what it needs…"></textarea>

        <div class="form-row">
          <div>
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Basel">
          </div>
          <div>
            <label for="construction_year">Year built</label>
            <input type="number" id="construction_year" min="1970" max="2100" placeholder="e.g. 2015">
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="organization">Lab / university / group</label>
            <input type="text" id="organization" placeholder="e.g. Proteomics Core, Uni Bern">
          </div>
          <div>
            <label for="inventory_number">Inventory number (optional)</label>
            <input type="text" id="inventory_number" placeholder="e.g. INV-2024-0113">
          </div>
        </div>

        <label for="contact_email">Contact email</label>
        <input type="email" id="contact_email" placeholder="name@institution.ch">

        <label for="photo">Photo (optional — auto-cropped to a 300×300 square)</label>
        <input type="file" id="photo" accept="image/*">

        <button type="submit" class="btn btn-primary auth-submit">Post to the board</button>
        <p class="form-msg" id="post-msg"></p>
      </form>
    </div>
  </section>
</div>

<!-- ============ DETAIL MODAL ============ -->
<div id="detail-modal" class="modal-backdrop" style="display:none;">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js'

  const userEmailEl = document.getElementById('user-email')
  const signoutBtn = document.getElementById('signout-btn')
  const appTabs = document.querySelectorAll('.app-tab')
  const viewBrowse = document.getElementById('view-browse')
  const viewHistory = document.getElementById('view-history')
  const viewPost = document.getElementById('view-post')
  let currentTypeFilter = 'offer' // matches the initially-active "See what's available" tab

  let currentUser = null
  let currentProfile = null
  let allListings = []

  // ---- Auth guard ----
  const { data: sessionData } = await supabase.auth.getSession()
  if (!sessionData.session) {
    window.location.href = 'login.html'
  } else {
    currentUser = sessionData.session.user
    userEmailEl.textContent = currentUser.email
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    if (!session) window.location.href = 'login.html'
  })

  signoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    window.location.href = 'index.html'
  })

  // load (or lazily create) this user's profile, and prefill the post form's contact email
  const { data: profileData } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle()
  currentProfile = profileData
  document.getElementById('contact_email').value = currentUser.email
  if (currentProfile?.organization) {
    document.getElementById('organization').value = currentProfile.organization
  }

  // ---- Top-level navigation: 3 view tabs + 1 primary "post" action ----
  function showView(view) {
    appTabs.forEach(t => t.classList.toggle('active', t.dataset.view === view))
    viewBrowse.style.display = (view === 'available' || view === 'needed') ? 'block' : 'none'
    viewHistory.style.display = view === 'history' ? 'block' : 'none'
    viewPost.style.display = view === 'post' ? 'block' : 'none'
    if (view === 'available') { currentTypeFilter = 'offer'; renderGrid() }
    if (view === 'needed') { currentTypeFilter = 'request'; renderGrid() }
  }
  appTabs.forEach(tab => {
    tab.addEventListener('click', () => showView(tab.dataset.view))
  })
  document.getElementById('open-post-btn').addEventListener('click', () => showView('post'))
  document.getElementById('post-close-btn').addEventListener('click', () => showView('available'))

  // ---- Brand/model catalog, researched per category ----
  // Each category maps to brands; each brand maps to real model names
  // where we could find them. "Other" is always available so people
  // can type in anything not on the list.
  const CATALOG = {
    'Instrument': {
      'Waters': ['Xevo TQ-S', 'Xevo TQ-XS', 'Xevo TQ Absolute', 'Xevo G2-XS QTof', 'Xevo G3 QTof', 'Xevo MRT', 'SYNAPT G2-Si', 'SYNAPT XS', 'Vion IMS QTof', 'ACQUITY QDa', 'BioAccord', 'Other'],
      'Thermo Fisher': ['Orbitrap Exploris 120', 'Orbitrap Exploris 240', 'Orbitrap Exploris 480', 'Q Exactive', 'Q Exactive Plus', 'Q Exactive HF', 'Q Exactive HF-X', 'Orbitrap Fusion', 'Orbitrap Fusion Lumos', 'Orbitrap Eclipse', 'Orbitrap IQ-X', 'Orbitrap Ascend', 'Orbitrap Astral', 'TSQ Altis', 'TSQ Quantis', 'TSQ Endura', 'LTQ', 'Other'],
      'Agilent': ['6470 Triple Quad', '6475 Triple Quad', '6490 Triple Quad', '6495 Triple Quad', '6495C Triple Quad', '6495D Triple Quad', '6230 TOF', '6530 Q-TOF', '6545 Q-TOF', '6546 Q-TOF', '6550 Q-TOF', '6560 IM-QTOF', '7010 Triple Quad GC/MS', '7250 GC/Q-TOF', 'Ultivo', 'Other'],
      'Bruker': ['timsTOF Pro', 'timsTOF Pro 2', 'timsTOF HT', 'timsTOF Ultra', 'timsTOF SCP', 'timsTOF fleX', 'impact II', 'maXis II', 'solariX', 'scimaX', 'rapifleX MALDI', 'autoflex', 'microflex', 'amaZon speed', 'Other'],
      'AB Sciex': ['Triple Quad 3500', 'Triple Quad 5500', 'Triple Quad 6500', 'Triple Quad 6500+', 'Triple Quad 7500', 'QTRAP 4500', 'QTRAP 5500', 'QTRAP 6500', 'QTRAP 6500+', 'X500 QTOF', 'X500B', 'X500R', 'ZenoTOF 7600', 'TripleTOF 6600', 'Other'],
      'Shimadzu': ['LCMS-8040', 'LCMS-8045', 'LCMS-8050', 'LCMS-8060', 'LCMS-9030', 'LCMS-2020', 'LCMS-2050', 'AXIMA MALDI', 'Other'],
      'PerkinElmer': [],
      'JEOL': [],
      'Other': []
    },
    'Column': {
      'Waters': ['ACQUITY UPLC BEH C18', 'ACQUITY UPLC BEH C8', 'ACQUITY UPLC HSS T3', 'ACQUITY UPLC CSH', 'XTerra', 'Symmetry C18', 'Atlantis', 'Nova-Pak', 'CORTECS', 'Other'],
      'Agilent': ['ZORBAX Eclipse XDB-C18', 'ZORBAX Eclipse Plus C18', 'ZORBAX SB-C18', 'ZORBAX StableBond', 'InfinityLab Poroshell 120', 'Other'],
      'Phenomenex': ['Luna C18', 'Luna Omega', 'Kinetex C18', 'Kinetex XB-C18', 'Synergi', 'Gemini', 'Other'],
      'Thermo Fisher': ['Hypersil GOLD', 'Accucore', 'Acclaim', 'Hypersil BDS', 'Other'],
      'Merck / Sigma-Aldrich': ['LiChrospher', 'LiChroCART', 'Ascentis Express', 'Supelcosil', 'Other'],
      'Restek': ['Raptor', 'Allure', 'Other'],
      'Macherey-Nagel': ['Nucleosil', 'Nucleodur', 'Other'],
      'YMC': ['YMC-Triart', 'YMC Pro C18', 'Other'],
      'Other': []
    }
  }
  // Categories without a curated brand list fall back to this shared
  // set of common instrument vendors (spare parts, consumables, and
  // standards are usually tied to one of these).
  const DEFAULT_BRANDS = ['Waters', 'Thermo Fisher', 'Agilent', 'Bruker', 'AB Sciex', 'Shimadzu', 'PerkinElmer', 'JEOL', 'Bio-Rad', 'Other']

  function brandsForCategory(category) {
    if (CATALOG[category]) return Object.keys(CATALOG[category])
    return DEFAULT_BRANDS
  }
  function modelsForBrand(category, brand) {
    return CATALOG[category]?.[brand] || null // null = no curated list, use free text
  }


  const grid = document.getElementById('listings-grid')
  const fCategory = document.getElementById('f-category')
  const fBrand = document.getElementById('f-brand')
  const fModel = document.getElementById('f-model')
  const fCondition = document.getElementById('f-condition')
  const fOrg = document.getElementById('f-org')
  const clearFiltersBtn = document.getElementById('clear-filters')

  function populateSelect(select, values, placeholderKeep = true) {
    const existing = new Set(Array.from(select.options).map(o => o.value))
    values.forEach(v => {
      if (v && !existing.has(v)) {
        const opt = document.createElement('option')
        opt.value = v
        opt.textContent = v
        select.appendChild(opt)
      }
    })
  }

  // replaces all options (used for cascading selects, where the old
  // options are no longer valid once the parent selection changes)
  function replaceOptions(select, values, placeholderLabel) {
    select.innerHTML = ''
    const placeholder = document.createElement('option')
    placeholder.value = ''
    placeholder.textContent = placeholderLabel
    select.appendChild(placeholder)
    values.forEach(v => {
      const opt = document.createElement('option')
      opt.value = v
      opt.textContent = v
      select.appendChild(opt)
    })
  }

  // filter: category -> brand cascades
  function refreshFilterBrands() {
    const cat = fCategory.value
    const brands = cat ? brandsForCategory(cat) : [...new Set([...Object.keys(CATALOG.Instrument), ...Object.keys(CATALOG.Column), ...DEFAULT_BRANDS])]
    replaceOptions(fBrand, brands.sort(), 'All brands')
  }
  fCategory.addEventListener('change', () => { refreshFilterBrands(); renderGrid() })
  refreshFilterBrands()

  function escapeHtml(str) {
    const div = document.createElement('div')
    div.textContent = str || ''
    return div.innerHTML
  }

  function formatDate(iso) {
    const d = new Date(iso)
    return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })
  }

  function applyFilters(items) {
    return items.filter(item => {
      if (currentTypeFilter && item.type !== currentTypeFilter) return false
      if (fCategory.value && item.category !== fCategory.value) return false
      if (fBrand.value && item.brand !== fBrand.value) return false
      if (fModel.value && item.model !== fModel.value) return false
      if (fCondition.value && item.condition !== fCondition.value) return false
      if (fOrg.value && item.organization !== fOrg.value) return false
      return true
    })
  }

  function renderGrid() {
    const items = applyFilters(allListings)
    if (items.length === 0) {
      grid.innerHTML = `<div class="empty-state">Nothing matches those filters yet.</div>`
      return
    }
    grid.innerHTML = `
      <div class="listing-row listing-row--head">
        <span></span>
        <span>Type</span>
        <span>Item</span>
        <span>Lab / university</span>
        <span>Condition</span>
      </div>
    ` + items.map(item => `
      <div class="listing-row" data-id="${item.id}">
        <div class="listing-row-photo">
          ${item.photo_url
            ? `<img src="${item.photo_url}" alt="">`
            : `<div class="listing-row-photo-placeholder">${item.type === 'offer' ? '📦' : '🔍'}</div>`}
        </div>
        <span class="tag ${item.type === 'offer' ? 'tag-offer' : 'tag-request'}">${item.type === 'offer' ? 'Offer' : 'Request'}</span>
        <div class="listing-row-title">
          <strong>${escapeHtml(item.title)}</strong>
          <span class="listing-row-sub">${[item.category, [item.brand, item.model].filter(Boolean).join(' ')].filter(Boolean).join(' · ')}</span>
        </div>
        <div class="listing-row-org">${escapeHtml(item.organization || '—')}</div>
        <div class="listing-row-condition">${escapeHtml(item.condition || '—')}</div>
      </div>
    `).join('')

    grid.querySelectorAll('.listing-row[data-id]').forEach(row => {
      row.addEventListener('click', () => openDetail(row.dataset.id))
    })
  }

  async function loadListings() {
    const { data, error } = await supabase
      .from('listings')
      .select('*')
      .eq('status', 'open')
      .order('created_at', { ascending: false })

    if (error) {
      grid.innerHTML = `<div class="empty-state">Could not load the board: ${escapeHtml(error.message)}</div>`
      return
    }
    allListings = data
    populateSelect(fModel, [...new Set(data.map(d => d.model))].sort())
    populateSelect(fOrg, [...new Set(data.map(d => d.organization))].sort())
    renderGrid()
  }

  async function loadHistory() {
    const historyList = document.getElementById('history-list')
    const { data, error } = await supabase
      .from('listings')
      .select('*')
      .eq('status', 'closed')
      .not('claimed_by', 'is', null)
      .order('claimed_at', { ascending: false })
      .limit(12)

    if (error || !data || data.length === 0) {
      historyList.innerHTML = `<p class="empty-state">Nothing given away yet.</p>`
      return
    }
    historyList.innerHTML = `
      <div class="listing-row listing-row--head">
        <span></span>
        <span>Type</span>
        <span>Item</span>
        <span>Went to</span>
        <span>When</span>
      </div>
    ` + data.map(item => `
      <div class="listing-row listing-row--static">
        <div class="listing-row-photo">
          ${item.photo_url
            ? `<img src="${item.photo_url}" alt="">`
            : `<div class="listing-row-photo-placeholder">${item.type === 'offer' ? '📦' : '🔍'}</div>`}
        </div>
        <span class="tag ${item.type === 'offer' ? 'tag-offer' : 'tag-request'}">${item.type === 'offer' ? 'Offer' : 'Request'}</span>
        <div class="listing-row-title">
          <strong>${escapeHtml(item.title)}</strong>
          <span class="listing-row-sub">${[item.category, [item.brand, item.model].filter(Boolean).join(' ')].filter(Boolean).join(' · ')}</span>
        </div>
        <div class="listing-row-org">${escapeHtml(item.claimed_by)}</div>
        <div class="listing-row-condition">${formatDate(item.claimed_at)}</div>
      </div>
    `).join('')
  }

  ;[fCategory, fBrand, fModel, fCondition, fOrg].forEach(sel => sel.addEventListener('change', renderGrid))
  clearFiltersBtn.addEventListener('click', () => {
    fCategory.value = ''; fBrand.value = ''; fModel.value = ''; fCondition.value = ''; fOrg.value = ''
    renderGrid()
  })

  // ---- Detail modal ----
  const modal = document.getElementById('detail-modal')
  const modalBody = document.getElementById('modal-body')
  document.getElementById('modal-close').addEventListener('click', () => modal.style.display = 'none')
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none' })

  function openDetail(id) {
    const item = allListings.find(i => i.id === id)
    if (!item) return

    const mailto = `mailto:${encodeURIComponent(item.contact_email || '')}?subject=${encodeURIComponent('SwissMsRecycle: ' + item.title)}`

    modalBody.innerHTML = `
      ${item.photo_url ? `<img class="modal-photo" src="${item.photo_url}" alt="">` : ''}
      <span class="tag ${item.type === 'offer' ? 'tag-offer' : 'tag-request'}">${item.type === 'offer' ? 'Offer' : 'Request'}</span>
      <h2>${escapeHtml(item.title)}</h2>
      ${item.description ? `<p class="modal-desc">${escapeHtml(item.description)}</p>` : ''}
      <dl class="modal-details">
        ${item.category ? `<dt>Category</dt><dd>${escapeHtml(item.category)}</dd>` : ''}
        ${item.brand ? `<dt>Brand</dt><dd>${escapeHtml(item.brand)}</dd>` : ''}
        ${item.model ? `<dt>Model</dt><dd>${escapeHtml(item.model)}</dd>` : ''}
        ${item.condition ? `<dt>Condition</dt><dd>${escapeHtml(item.condition)}</dd>` : ''}
        ${item.location ? `<dt>Location</dt><dd>${escapeHtml(item.location)}</dd>` : ''}
        ${item.organization ? `<dt>Lab / university</dt><dd>${escapeHtml(item.organization)}</dd>` : ''}
        ${item.construction_year ? `<dt>Year built</dt><dd>${escapeHtml(String(item.construction_year))}</dd>` : ''}
        ${item.inventory_number ? `<dt>Inventory #</dt><dd>${escapeHtml(item.inventory_number)}</dd>` : ''}
        <dt>Posted</dt><dd>${formatDate(item.created_at)}</dd>
      </dl>
      <div class="modal-actions">
        <a href="${mailto}" class="btn btn-accent btn-sm">Send email</a>
        <button class="btn btn-ghost btn-sm" id="copy-email-btn">Copy email</button>
        ${item.user_id !== currentUser.id ? `<button class="btn btn-ghost btn-sm" id="ask-available-btn">Still available? Ask</button>` : ''}
        ${item.user_id === currentUser.id ? `<button class="btn btn-ghost btn-sm" id="mark-given-btn">Mark as given away</button>` : ''}
        ${item.user_id === currentUser.id ? `<button class="btn btn-ghost btn-sm" id="remove-listing-btn">Remove listing</button>` : ''}
      </div>
      <p class="listing-inquiry-count" id="inquiry-count">${item.inquiry_count ? `Asked ${item.inquiry_count} time${item.inquiry_count === 1 ? '' : 's'} so far` : ''}</p>
      <div id="mark-given-form" style="display:none;">
        <label for="claimed-by-input">Who took it?</label>
        <input type="text" id="claimed-by-input" placeholder="e.g. Proteomics Core, Uni Bern">
        <button class="btn btn-primary btn-sm" id="confirm-given-btn" type="button">Confirm</button>
      </div>
      <p class="form-msg" id="modal-msg"></p>
    `

    const copyBtn = document.getElementById('copy-email-btn')
    copyBtn?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(item.contact_email || '')
        document.getElementById('modal-msg').textContent = 'Email copied.'
      } catch {
        document.getElementById('modal-msg').textContent = item.contact_email || ''
      }
    })

    document.getElementById('ask-available-btn')?.addEventListener('click', async () => {
      const { error } = await supabase.rpc('increment_inquiry', { listing_id: item.id })
      if (!error) {
        item.inquiry_count = (item.inquiry_count || 0) + 1
        document.getElementById('inquiry-count').textContent = `Asked ${item.inquiry_count} time${item.inquiry_count === 1 ? '' : 's'} so far`
      }
      window.location.href = mailto + '&body=' + encodeURIComponent('Hi, is this still available?')
    })

    document.getElementById('mark-given-btn')?.addEventListener('click', () => {
      document.getElementById('mark-given-form').style.display = 'block'
      document.getElementById('claimed-by-input').focus()
    })

    document.getElementById('confirm-given-btn')?.addEventListener('click', async () => {
      const claimedBy = document.getElementById('claimed-by-input').value.trim()
      if (!claimedBy) return
      const { error } = await supabase.from('listings').update({
        status: 'closed',
        claimed_by: claimedBy,
        claimed_at: new Date().toISOString()
      }).eq('id', item.id)
      if (!error) {
        modal.style.display = 'none'
        loadListings()
        loadHistory()
      } else {
        document.getElementById('modal-msg').textContent = error.message
      }
    })

    document.getElementById('remove-listing-btn')?.addEventListener('click', async () => {
      const { error } = await supabase.from('listings').delete().eq('id', item.id)
      if (!error) { modal.style.display = 'none'; loadListings() }
    })

    modal.style.display = 'flex'
  }

  // ============ POST ============
  const postTypeToggle = document.getElementById('post-type-toggle')
  const postForm = document.getElementById('post-form')
  const postMsg = document.getElementById('post-msg')
  let postType = 'offer'

  postTypeToggle.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      postTypeToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      postType = btn.dataset.type
    })
  })

  // ---- category -> brand -> model, cascading ----
  const categorySelect = document.getElementById('category')
  const brandSelect = document.getElementById('brand')
  const modelSelect = document.getElementById('model')
  const modelTextInput = document.getElementById('model-text')

  function refreshPostBrands() {
    replaceOptions(brandSelect, brandsForCategory(categorySelect.value), '—')
    refreshPostModels()
  }

  function refreshPostModels() {
    const models = modelsForBrand(categorySelect.value, brandSelect.value)
    if (models && models.length) {
      replaceOptions(modelSelect, models, '—')
      modelSelect.style.display = 'block'
      modelTextInput.style.display = 'none'
      modelTextInput.value = ''
    } else {
      modelSelect.style.display = 'none'
      modelTextInput.style.display = 'block'
    }
  }

  categorySelect.addEventListener('change', refreshPostBrands)
  brandSelect.addEventListener('change', refreshPostModels)
  modelSelect.addEventListener('change', () => {
    // "Other" on a curated model list reveals the free-text field too,
    // so people can say exactly which model it is
    modelTextInput.style.display = modelSelect.value === 'Other' ? 'block' : 'none'
    if (modelSelect.value !== 'Other') modelTextInput.value = ''
  })
  refreshPostBrands()

  function currentModelValue() {
    if (modelSelect.style.display !== 'none' && modelSelect.value && modelSelect.value !== 'Other') {
      return modelSelect.value
    }
    return modelTextInput.value.trim() || null
  }

  // Resize/crop any photo down to a clean 300x300 square before it
  // ever leaves the browser — keeps every listing's thumbnail the
  // same size and shape, and keeps uploads small.
  function resizeImageToSquare(file, size = 300) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader()
      reader.onerror = () => reject(new Error('Could not read that image.'))
      reader.onload = (e) => {
        const img = new Image()
        img.onerror = () => reject(new Error('Could not read that image.'))
        img.onload = () => {
          const minSide = Math.min(img.width, img.height)
          const sx = (img.width - minSide) / 2
          const sy = (img.height - minSide) / 2
          const canvas = document.createElement('canvas')
          canvas.width = size
          canvas.height = size
          const ctx = canvas.getContext('2d')
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size)
          canvas.toBlob(
            (blob) => blob ? resolve(blob) : reject(new Error('Could not process that image.')),
            'image/jpeg',
            0.86
          )
        }
        img.src = e.target.result
      }
      reader.readAsDataURL(file)
    })
  }

  postForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    postMsg.className = 'form-msg'
    postMsg.textContent = 'Posting…'

    const photoFile = document.getElementById('photo').files[0]
    let photo_url = null

    try {
      if (photoFile) {
        const squarePhoto = await resizeImageToSquare(photoFile, 300)
        const path = `${currentUser.id}/${Date.now()}.jpg`
        const { error: uploadError } = await supabase.storage
          .from('listing-photos')
          .upload(path, squarePhoto, { contentType: 'image/jpeg' })
        if (uploadError) throw uploadError
        const { data: pub } = supabase.storage.from('listing-photos').getPublicUrl(path)
        photo_url = pub.publicUrl
      }

      const { error } = await supabase.from('listings').insert({
        user_id: currentUser.id,
        type: postType,
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value,
        brand: document.getElementById('brand').value || null,
        model: currentModelValue(),
        condition: document.getElementById('condition').value || null,
        description: document.getElementById('description').value.trim(),
        location: document.getElementById('location').value.trim(),
        organization: document.getElementById('organization').value.trim(),
        contact_email: document.getElementById('contact_email').value.trim(),
        construction_year: document.getElementById('construction_year').value || null,
        inventory_number: document.getElementById('inventory_number').value.trim() || null,
        photo_url
      })
      if (error) throw error

      postForm.reset()
      refreshPostBrands()
      document.getElementById('contact_email').value = currentUser.email
      postMsg.className = 'form-msg ok'
      postMsg.textContent = 'Posted to the board.'
      loadListings()
      setTimeout(() => showView('available'), 700)
    } catch (err) {
      postMsg.className = 'form-msg error'
      postMsg.textContent = err.message || 'Something went wrong.'
    }
  })

  // ---- Realtime ----
  supabase
    .channel('listings-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'listings' }, () => { loadListings(); loadHistory() })
    .subscribe()

  loadListings()
  loadHistory()
</script>

</body>
